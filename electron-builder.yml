appId: com.yangdabao.freerpa
productName: FreeRPA
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/**'
  - '!resources/**'
  # 浏览器内核只经 extraResources 按平台单独分发，避免重复打进 asar 导致包体膨胀
  - '!browser/**'
  - '!doc/**'
  - '!.trae/**'
  - '!.reasonix/**'
  - '!electron.*{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,README.en.md,eslint.config.mjs,reasonix.toml,.editorconfig,.DS_Store}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,deno.lock,yarn.lock}'
  - '!*.zip'
asar: true
# esbuild 的平台原生二进制需保留在 asar 外：asar 内无法 spawn 可执行文件，
# 否则在编译后的客户端里「打包插件」会报 spawn ENOTDIR（开发环境 node_modules 为实体文件故正常）
asarUnpack:
  - node_modules/esbuild/**/*
  - node_modules/@esbuild/**/*
# deno 二进制与 worker 资源经 extraResources 分发（asar 外），不打包进 asar
extraResources:
  - from: resources/deno
    to: deno
    filter:
      - '!**/.DS_Store'
  - from: resources/worker
    to: worker
    filter:
      - '**/*'
      - '!node_modules/**'
      - '!**/.DS_Store'
  # 依赖闭包单独复制（deno 布局已实体化，打包必须包含，否则运行时无法解析节点依赖）
  - from: resources/worker/node_modules
    to: worker/node_modules
  # 托盘图标（build/ 是 buildResources，electron-builder 会排除出 asar，故经 extraResources 分发）
  - from: build/tray.png
    to: tray.png
  # macOS 专属托盘图标
  - from: build/tray-mac.png
    to: tray-mac.png
win:
  executableName: FreeRPA
  # 内置浏览器内核：仅打包当前平台（resources/browser/win），随包分发无需下载
  extraResources:
    - from: browser/win32
      to: browser/win32
      filter:
        - '!**/.DS_Store'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # 内置浏览器内核：仅打包当前平台（resources/browser/darwin），随包分发无需下载
  extraResources:
    - from: browser/darwin
      to: browser/darwin
      filter:
        - '!**/.DS_Store'
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
  # 内置浏览器内核：仅打包当前平台（resources/browser/linux），随包分发无需下载
  extraResources:
    - from: browser/linux
      to: browser/linux
      filter:
        - '!**/.DS_Store'
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
